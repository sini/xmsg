[package]
name = "xmsg"
version = "0.1.0"
edition = "2021"
description = "Fast, lightweight local HTTP bridge into live agent sessions"
license = "MIT"
autotests = false

[[bin]]
name = "xmsg"
path = "src/main.rs"
required-features = ["daemon"]

[lib]
name = "xmsg"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync", "fs", "process", "signal"] }
axum = { optional = true, version = "0.8.1", features = ["tokio", "http1", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { optional = true, version = "4.5", features = ["derive", "env"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { optional = true, version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
gethostname = { version = "1.1", optional = true }
unicode-general-category = { version = "1.1", optional = true }
regex = { version = "1.11", optional = true }
rusqlite = { optional = true, version = "0.40", features = ["bundled"] }
ulid = { version = "1.2", optional = true }
reqwest = { optional = true, version = "0.12", default-features = false, features = ["json", "blocking"] }
rustls = { optional = true, version = "0.23.45", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { optional = true, version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { optional = true, version = "0.14.10", features = ["pem", "ring"] }
sha2 = { version = "0.11.0", optional = true }
hex = { version = "0.4.3", optional = true }
base64 = { version = "0.23.1", optional = true }
http-body-util = { version = "0.1.5", optional = true }
tower = { optional = true, version = "0.5.3", features = ["util"] }
hyper-util = { optional = true, version = "0.1.21", features = ["server", "client", "tokio", "http1", "server-auto", "service"] }
x509-parser = { version = "0.18.1", optional = true }
bytes = { version = "1.12.1", optional = true }
hyper = { optional = true, version = "1.12.0", features = ["full"] }
webpki = { optional = true, package = "rustls-webpki", version = "0.103.15", default-features = false, features = ["ring"] }
libc = "0.2"
getrandom = { version = "0.3", optional = true }
subtle = { version = "2.6", optional = true }


[features]
default = ["daemon"]
client = []
daemon = ["client", "dep:axum", "dep:clap", "dep:tracing", "dep:tracing-subscriber", "dep:gethostname", "dep:unicode-general-category", "dep:regex", "dep:rusqlite", "dep:ulid", "dep:reqwest", "dep:rustls", "dep:tokio-rustls", "dep:rcgen", "dep:sha2", "dep:hex", "dep:base64", "dep:http-body-util", "dep:tower", "dep:hyper-util", "dep:x509-parser", "dep:bytes", "dep:hyper", "dep:webpki", "dep:getrandom", "dep:subtle"]
test-hooks = []

[dev-dependencies]
proptest = "1.6"
tempfile = "3.17"
xmsg = { path = ".", default-features = false, features = ["test-hooks"] }

[profile.release]
opt-level = 2

[[test]]
name = "agent_sock"
path = "tests/agent_sock.rs"
required-features = ["daemon"]

