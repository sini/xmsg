[package]
name = "xmsg"
version = "0.1.0"
edition = "2021"
description = "Fast, lightweight local HTTP bridge into live agent sessions"
license = "MIT"

[[bin]]
name = "xmsg"
path = "src/main.rs"

[lib]
name = "xmsg"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.43", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync", "fs"] }
axum = { version = "0.8.1", features = ["tokio", "http1", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
gethostname = "1.1"
unicode-general-category = "1.1"
regex = "1.11"
rusqlite = { version = "0.33", features = ["bundled"] }
ulid = "1.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }

[dev-dependencies]
proptest = "1.6"
tempfile = "3.17"

[profile.release]
opt-level = 2
