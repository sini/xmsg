{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "xmsg.fullname" . }}
  labels:
    {{- include "xmsg.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "xmsg.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if .Values.networkPolicy.allowedPeers }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.allowedPeers | nindent 8 }}
      ports:
        - protocol: TCP
          port: 7788
  {{- else }}
  ingress: []
  {{- end }}
{{- end }}
