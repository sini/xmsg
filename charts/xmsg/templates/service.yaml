apiVersion: v1
kind: Service
metadata:
  name: {{ include "xmsg.fullname" . }}
  labels:
    {{- include "xmsg.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "xmsg.selectorLabels" . | nindent 4 }}
  ports:
    - name: federation
      port: 7788
      targetPort: federation
      protocol: TCP
