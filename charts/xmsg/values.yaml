# node: one full node or federation hub (StatefulSet). leaf: an outbound-only leaf
# sidecar beside your application containers (Deployment); see `leaf` below.
mode: node

# Optional override for the generated resource name prefix (defaults to <release>-xmsg).
fullnameOverride: ""

serviceAccount:
  # Optional ServiceAccount name override (defaults to xmsg.fullname).
  name: ""

image:
  repository: ghcr.io/sini/xmsg
  # Use an immutable published tag for upgrades.
  tag: latest
  # Optional sha256 digest takes precedence over tag.
  digest: ""
  pullPolicy: IfNotPresent

# Required: the canonical name derived from this node's certificate, not its nickname.
canonicalNodeName: ""
tls:
  # Required existing kubernetes.io/tls Secret; no credentials are issued by this chart.
  existingSecret: ""
ca:
  # Optional public CA ConfigMap, mounted as files under /etc/xmsg/ca.
  existingConfigMap: ""

# Written verbatim inside {"peers": ...}. CA peers can use ca: /etc/xmsg/ca/ca.crt.
peers: {}

# Optional trusted service name -> executable mapping. The bundled image has /bin/xmsg.
trustedServices: {}

securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

resources: {}

persistence:
  # One writer per database: replicas are fixed at one. Never share this PVC with
  # another running daemon; stop the old writer before replacing or restoring it.
  size: 1Gi
  # Empty uses the cluster's default StorageClass.
  storageClassName: ""

networkPolicy:
  enabled: false
  # Ingress only; DNS and all egress remain unchanged. Empty means deny all ingress.
  # namespaceSelector and podSelector in ONE entry are ANDed. For example:
  # allowedPeers:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: gateway
  #     podSelector:
  #       matchLabels:
  #         app.kubernetes.io/name: xmsg-mcp-gateway
  allowedPeers: []

# Used only when mode is leaf. The pod runs every container as securityContext.runAsUser.
leaf:
  # Required: the --leaf-principal the app container registers as.
  principal: ""
  # Image for the prepare-state init container; it needs only `mkdir`.
  prepareImage: busybox:1.37
  # Hubs this leaf dials: [{name, address, identity}]. Each is allowed `list` only, and
  # its CA is the TLS Secret's ca.crt.
  hubs: []
  # Your application containers. Each gets XDG_RUNTIME_DIR=/run, the shared runtime
  # mount, and the hardened securityContext when it sets none.
  containers: []
  # Extra pod volumes your application containers mount.
  volumes: []
