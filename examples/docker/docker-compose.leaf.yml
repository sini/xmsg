services:
  node-a:
    image: ${XMSG_IMAGE:-ghcr.io/sini/xmsg:latest}
    user: "${XMSG_UID:?Run prepare.py}:${XMSG_GID:?Run prepare.py}"
    command: ["serve"]
    environment:
      XDG_RUNTIME_DIR: /run
      XMSG_DB_PATH: /var/lib/xmsg/xmsg.db
      XMSG_FED_LISTEN: 0.0.0.0:7788
      XMSG_PEERS_FILE: /etc/xmsg/peers.json
      XMSG_FED_CERT: /etc/xmsg/identity/node.crt
      XMSG_FED_KEY: /etc/xmsg/identity/node.key
      XMSG_SESSIONS_DIR: /var/lib/xmsg/sessions
      XMSG_CODEX_HOME: /var/lib/xmsg/codex
    volumes:
      - ./.local/a/state:/var/lib/xmsg
      - ./.local/a/run:/run/xmsg
      - ./.local/a/identity:/etc/xmsg/identity:ro
      - ./.local/a/peers.leaf.json:/etc/xmsg/peers.json:ro
  leaf:
    container_name: "${COMPOSE_PROJECT_NAME:-xmsg-demo}-leaf"
    image: ${XMSG_IMAGE:-ghcr.io/sini/xmsg:latest}
    user: "${XMSG_UID:?Run prepare.py}:${XMSG_GID:?Run prepare.py}"
    command: ["serve", "--leaf", "--leaf-principal", "svc:demo", "--listen", "127.0.0.1:7787"]
    environment:
      XDG_RUNTIME_DIR: /run
      XMSG_DB_PATH: /var/lib/xmsg/xmsg.db
      XMSG_PEERS_FILE: /etc/xmsg/peers.json
      XMSG_FED_CERT: /etc/xmsg/identity/node.crt
      XMSG_FED_KEY: /etc/xmsg/identity/node.key
      XMSG_SESSIONS_DIR: /var/lib/xmsg/sessions
      XMSG_CODEX_HOME: /var/lib/xmsg/codex
    volumes:
      - ./.local/leaf/state:/var/lib/xmsg
      - ./.local/leaf/run:/run/xmsg
      - ./.local/leaf/identity:/etc/xmsg/identity:ro
      - ./.local/leaf/peers.json:/etc/xmsg/peers.json:ro
    depends_on: [node-a]
  demo-service:
    image: ${XMSG_IMAGE:-ghcr.io/sini/xmsg:latest}
    user: "${XMSG_UID:?Run prepare.py}:${XMSG_GID:?Run prepare.py}"
    command: ["service", "exec", "--name", "demo", "--", "/bin/xmsg", "--version"]
    environment:
      XDG_RUNTIME_DIR: /run
    network_mode: service:leaf
    pid: "container:${COMPOSE_PROJECT_NAME:-xmsg-demo}-leaf"
    volumes:
      - ./.local/leaf/run:/run/xmsg
    depends_on: [leaf]
