# cargo-deny configuration for xmsg (checked in CI `deps` job and weekly schedule).

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Triaged advisories (2026-11-21); review or remove as upstream deps and MSRV advance (review date: 2027-02-01).
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa 0.9.10 via openidconnect 4.1.0: prod performs public-key JWS verification only (no RSA private-key decryption/signing); blocked on openidconnect adopting rsa >= 0.10.0 (triaged 2026-11-21; review 2027-02-01)" },
    { id = "RUSTSEC-2026-0459", reason = "libsqlite3-sys 0.38.2 via rusqlite 0.40.2: DBs live in same-UID 0700/0600 private dirs (UID trust boundary); fix requires breaking rusqlite >= 0.41 and MSRV 1.89 (triaged 2026-11-21; review 2027-02-01)" },
    { id = "RUSTSEC-2026-0543", reason = "chrono 0.4.45 informational unmaintained (no vulnerability): unconditionally required by openidconnect 4.1.0 and oauth2 5.0.0 (triaged 2026-11-21; review 2027-02-01)" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
