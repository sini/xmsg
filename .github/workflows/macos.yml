name: macOS
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:
    inputs:
      lock_probe:
        description: Run twenty writer-lock fixture iterations
        type: boolean
        default: false
      test_filter:
        description: Optional isolated probe test name
        default: ""
      revision:
        description: Optional revision under measurement (defaults to the dispatched ref)
        default: ""

permissions:
  contents: read

jobs:
  package:
    if: ${{ !inputs.lock_probe }}
    # Apple Silicon. `-latest` tracks the macOS users run and follows the
    # repository's `ubuntu-latest`; an image migration is the breakage this job
    # exists to catch.
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Forced failed-build pipeline control
        id: failed_pipeline
        continue-on-error: true
        run: (exit 23) | tee /tmp/xmsg-failed-pipeline-control
      - name: Require the failed pipeline to be rejected
        if: ${{ always() }}
        env:
          CONTROL_OUTCOME: ${{ steps.failed_pipeline.outcome }}
        run: test "$CONTROL_OUTCOME" = failure

      # gen-harness's `nix` column pin (evaluators.yml), upstream Nix like a
      # stock darwin install.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          github_access_token: ${{ github.token }}
          # Sandbox off on purpose: the sandboxed Linux package build already
          # gates sandbox purity, and the darwin sandbox is brittle.
          extra_nix_config: |
            sandbox = false
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      # No cache step: gen-harness dropped magic-nix-cache because its Post
      # step re-uploads what the job just downloaded.

      - name: Configure Attic substituter
        env:
          ATTIC_PUBLIC_KEY: ${{ vars.ATTIC_PUBLIC_KEY }}
        run: |
          if [ -z "${ATTIC_PUBLIC_KEY:-}" ]; then
            echo "ATTIC_PUBLIC_KEY is not set; skipping Attic substituter configuration"
            exit 0
          fi
          sudo mkdir -p /etc/nix
          {
            echo "extra-substituters = https://cache.numtide.com https://attic.json64.dev/ci"
            echo "extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= ${ATTIC_PUBLIC_KEY}"
          } | sudo tee -a /etc/nix/nix.conf >/dev/null
          sudo launchctl kickstart -k system/org.nixos.nix-daemon || true

      # Release packaging and client checks stay separate from the ordinary dev-profile suite.
      - name: checks.package
        run: |
          nix --version
          echo "sandbox = $(nix config show sandbox)"
          sys=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix build "./ci#checks.$sys.package" "./ci#checks.$sys.shared-client" -L --no-link --print-out-paths | tee -a /tmp/attic-paths

      - name: checks.codex-hook
        run: |
          sys=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix build "./ci#checks.$sys.codex-hook" -L --no-link --print-out-paths | tee -a /tmp/attic-paths

      - name: checks.pre-xl1-compat
        run: |
          sys=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix build "./ci#checks.$sys.pre-xl1-compat" -L --no-link --print-out-paths | tee -a /tmp/attic-paths

      - name: Push to Attic cache
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [ -z "${ATTIC_TOKEN:-}" ]; then
            echo "ATTIC_TOKEN is not set; skipping Attic cache push"
            exit 0
          fi
          if [ ! -s /tmp/attic-paths ]; then
            echo "No paths to push; skipping Attic cache push"
            exit 0
          fi
          nix shell --inputs-from . nixpkgs#attic-client -c attic login ci https://attic.json64.dev "$ATTIC_TOKEN"
          for i in 1 2 3; do nix shell --inputs-from . nixpkgs#attic-client -c sh -c 'xargs attic push ci < /tmp/attic-paths' && exit 0; echo "attic push ci failed (attempt $i)" >&2; sleep $((i * 10)); done; exit 1

  tests:
    if: ${{ !inputs.lock_probe }}
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Forced failed-build pipeline control
        id: failed_pipeline
        continue-on-error: true
        run: (exit 23) | tee /tmp/xmsg-failed-pipeline-control
      - name: Require the failed pipeline to be rejected
        if: ${{ always() }}
        env:
          CONTROL_OUTCOME: ${{ steps.failed_pipeline.outcome }}
        run: test "$CONTROL_OUTCOME" = failure

      # gen-harness's `nix` column pin (evaluators.yml), upstream Nix like a
      # stock darwin install.
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_url: https://releases.nixos.org/nix/nix-2.35.2/install
          github_access_token: ${{ github.token }}
          # Sandbox off on purpose: the sandboxed Linux package build already
          # gates sandbox purity, and the darwin sandbox is brittle.
          extra_nix_config: |
            sandbox = false
            extra-substituters = https://cache.numtide.com
            extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

      # No cache step: gen-harness dropped magic-nix-cache because its Post
      # step re-uploads what the job just downloaded.

      - name: Configure Attic substituter
        env:
          ATTIC_PUBLIC_KEY: ${{ vars.ATTIC_PUBLIC_KEY }}
        run: |
          if [ -z "${ATTIC_PUBLIC_KEY:-}" ]; then
            echo "ATTIC_PUBLIC_KEY is not set; skipping Attic substituter configuration"
            exit 0
          fi
          sudo mkdir -p /etc/nix
          {
            echo "extra-substituters = https://cache.numtide.com https://attic.json64.dev/ci"
            echo "extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= ${ATTIC_PUBLIC_KEY}"
          } | sudo tee -a /etc/nix/nix.conf >/dev/null
          sudo launchctl kickstart -k system/org.nixos.nix-daemon || true

      - name: Warm dev-profile test artifacts
        run: |
          sys=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix build "./ci#checks.$sys.tests.cargoArtifacts" -L --no-link --print-out-paths | tee -a /tmp/attic-paths
      - name: Ordinary tests and exact completion counts
        run: |
          sys=$(nix eval --impure --raw --expr builtins.currentSystem)
          nix build "./ci#checks.$sys.tests" -L --no-link --print-out-paths | tee -a /tmp/attic-paths
      - name: Push to Attic cache
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [ -z "${ATTIC_TOKEN:-}" ]; then
            echo "ATTIC_TOKEN is not set; skipping Attic cache push"
            exit 0
          fi
          if [ ! -s /tmp/attic-paths ]; then
            echo "No paths to push; skipping Attic cache push"
            exit 0
          fi
          nix shell --inputs-from . nixpkgs#attic-client -c attic login ci https://attic.json64.dev "$ATTIC_TOKEN"
          for i in 1 2 3; do nix shell --inputs-from . nixpkgs#attic-client -c sh -c 'xargs attic push ci < /tmp/attic-paths' && exit 0; echo "attic push ci failed (attempt $i)" >&2; sleep $((i * 10)); done; exit 1

  lock-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.lock_probe }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision || github.sha }}
      - name: Install toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Preserve admission diagnostics in disposable checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/codex.rs')
          s = p.read_text()
          old = 'let Ok(watch) = LockLeaseWatch::install(&canon_home, root_id) else {\n                continue;\n            };'
          new = '''let watch = match LockLeaseWatch::install(&canon_home, root_id) {
              Ok(watch) => watch,
              Err(error) => { eprintln!("XF6 install root={root_id} pid={owner_pid}: {error}"); continue; }
          };'''
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '.verify_continuity(&config.proc_root, owner_pid, owner_starttime)\n                .is_err()'
          new = '.verify_continuity(&config.proc_root, owner_pid, owner_starttime)\n                .inspect_err(|error| eprintln!("XF6 verify root={root_id} pid={owner_pid}: {error}"))\n                .is_err()'
          assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          PY
      - name: Compile once
        run: cargo +1.95.0 test --locked -j 4 --test gate_ha9_codex --no-run
      - name: Twenty fixture-suite iterations without retries
        shell: bash
        env:
          TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          failures=0
          for iteration in $(seq 1 20); do
            echo "XF6 iteration=$iteration begin"
            if cargo +1.95.0 test --locked -j 4 --test gate_ha9_codex "$TEST_FILTER" -- --nocapture > "iteration-$iteration.log" 2>&1; then
              echo "XF6 iteration=$iteration PASS"
            else
              failures=$((failures+1))
              echo "XF6 iteration=$iteration FAIL"
            fi
            cat "iteration-$iteration.log"
          done
          echo "XF6 failures=$failures/20"
          test "$failures" -eq 0
