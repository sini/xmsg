name: OCI Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  oci:
    runs-on: ubuntu-latest
    if: github.repository == 'sini/xmsg' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    # An explicit `shell: bash` runs steps under `bash -eo pipefail`; the implicit default
    # (`bash -e`) lets a failed `nix build | tee` pass.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Configure Attic substituter
        env:
          ATTIC_PUBLIC_KEY: ${{ vars.ATTIC_PUBLIC_KEY }}
        run: |
          if [ -z "${ATTIC_PUBLIC_KEY:-}" ]; then
            echo "ATTIC_PUBLIC_KEY is not set; skipping Attic substituter configuration"
            exit 0
          fi
          sudo mkdir -p /etc/nix
          {
            echo "extra-substituters = https://attic.json64.dev/ci"
            echo "extra-trusted-public-keys = ${ATTIC_PUBLIC_KEY}"
          } | sudo tee -a /etc/nix/nix.conf >/dev/null
          if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet nix-daemon 2>/dev/null; then
            sudo systemctl restart nix-daemon
          fi

      - name: Build OCI image
        run: |
          nix build -L --no-link --print-out-paths .#packages.x86_64-linux.cargoArtifacts | tee -a /tmp/attic-paths
          nix build -L .#image --out-link result-image --print-out-paths | tee -a /tmp/attic-paths

      - name: Run image oracle check
        run: |
          nix build -L --no-link --print-out-paths .#checks.x86_64-linux.image | tee -a /tmp/attic-paths

      - name: Push to Attic cache
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [ -z "${ATTIC_TOKEN:-}" ]; then
            echo "ATTIC_TOKEN is not set; skipping Attic cache push"
            exit 0
          fi
          if [ ! -s /tmp/attic-paths ]; then
            echo "No paths to push; skipping Attic cache push"
            exit 0
          fi
          nix shell --inputs-from . nixpkgs#attic-client -c attic login ci https://attic.json64.dev "$ATTIC_TOKEN"
          nix shell --inputs-from . nixpkgs#attic-client -c xargs -r -a /tmp/attic-paths attic push ci

      - name: Push image to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker load < result-image
          SHA_SHORT=$(git rev-parse --short HEAD)
          docker tag ghcr.io/sini/xmsg:latest "ghcr.io/sini/xmsg:sha-$SHA_SHORT"
          # GHCR sometimes rejects a manifest with "unknown blob" for a layer it has just accepted;
          # re-pushing uploads nothing new and retries the manifest. Bounded at 3 attempts.
          push() { for i in 1 2 3; do docker push "$1" && return 0; echo "docker push $1 failed (attempt $i)" >&2; sleep $((i * 10)); done; return 1; }
          push ghcr.io/sini/xmsg:latest
          push "ghcr.io/sini/xmsg:sha-$SHA_SHORT"
