name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      client_build_probe:
        description: Measure native per-arm client build costs without Nix or cache publication
        type: boolean
        default: false

env:
  FAST_CHECKS: >-
    agents-md-citations
    ci-plane-coverage
    ci-self-input
    default
    mdformat-plugins
    pi-extension
    pi-paths
    root-surface
    treefmt-tree-root
  PACKAGE_CHECKS: >-
    agy-hook
    codex-hook
    hermes-plugin
    opencode-plugin
    opencode2-plugin
    package
    peers-render
    pre-xl1-compat
    shared-client
    shared-client-compat

# One upstream-Nix column, not gen-harness's three-evaluator matrix: this is not a gen library, so
# evaluator divergence is not what its CI tests.
jobs:
  deps:
    if: ${{ !inputs.client_build_probe }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - name: Configure Attic and llm-agents substituters
        env:
          ATTIC_PUBLIC_KEY: ${{ vars.ATTIC_PUBLIC_KEY }}
        run: |
          sudo mkdir -p /etc/nix
          {
            echo "extra-substituters = https://cache.numtide.com${ATTIC_PUBLIC_KEY:+ https://attic.json64.dev/ci}"
            echo "extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=${ATTIC_PUBLIC_KEY:+ ${ATTIC_PUBLIC_KEY}}"
          } | sudo tee -a /etc/nix/nix.conf >/dev/null
          if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet nix-daemon 2>/dev/null; then
            sudo systemctl restart nix-daemon
          fi
      - name: Assert CI check coverage
        run: |
          expected=$(nix eval ./ci#checks.x86_64-linux --apply builtins.attrNames --json | jq -S .)
          read -r -a fast <<< "$FAST_CHECKS"
          read -r -a pkg <<< "$PACKAGE_CHECKS"
          covered=$(printf '%s\n' "${fast[@]}" "${pkg[@]}" | jq -R . | jq -s 'sort | unique')
          if [ "$expected" != "$covered" ]; then
            echo "CI check coverage mismatch!" >&2
            echo "Flake checks: $expected" >&2
            echo "Workflow checks: $covered" >&2
            diff -u <(echo "$expected") <(echo "$covered") >&2 || true
            exit 1
          fi
          echo "All $(echo "$expected" | jq length) checks covered."
      - name: ci devShell
        run: nix eval --raw "./ci#devShells.x86_64-linux.default.drvPath"
      - name: Fast checks
        run: |
          read -r -a fast <<< "$FAST_CHECKS"
          refs=()
          for c in "${fast[@]}"; do
            refs+=("./ci#checks.x86_64-linux.$c")
          done
          nix build -L --keep-going --no-link --print-out-paths "${refs[@]}" | tee -a /tmp/attic-paths
      - name: Source revision provenance and warm-store red drive
        run: python3 scripts/client-pin.py
      - name: Build cargoArtifacts
        run: |
          nix build -L --no-link --print-out-paths .#packages.x86_64-linux.cargoArtifacts | tee -a /tmp/attic-paths
      - name: Push to Attic cache
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [ -z "${ATTIC_TOKEN:-}" ]; then
            echo "ATTIC_TOKEN is not set; skipping Attic cache push"
            exit 0
          fi
          if [ ! -s /tmp/attic-paths ]; then
            echo "No paths to push; skipping Attic cache push"
            exit 0
          fi
          nix shell --inputs-from . nixpkgs#attic-client -c attic login ci https://attic.json64.dev "$ATTIC_TOKEN"
          for i in 1 2 3; do nix shell --inputs-from . nixpkgs#attic-client -c xargs -r -a /tmp/attic-paths attic push ci && exit 0; echo "attic push ci failed (attempt $i)" >&2; sleep $((i * 10)); done; exit 1

  package:
    if: ${{ !inputs.client_build_probe }}
    needs: [deps]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - name: Configure Attic and llm-agents substituters
        env:
          ATTIC_PUBLIC_KEY: ${{ vars.ATTIC_PUBLIC_KEY }}
        run: |
          sudo mkdir -p /etc/nix
          {
            echo "extra-substituters = https://cache.numtide.com${ATTIC_PUBLIC_KEY:+ https://attic.json64.dev/ci}"
            echo "extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=${ATTIC_PUBLIC_KEY:+ ${ATTIC_PUBLIC_KEY}}"
          } | sudo tee -a /etc/nix/nix.conf >/dev/null
          if command -v systemctl >/dev/null 2>&1 && systemctl is-active --quiet nix-daemon 2>/dev/null; then
            sudo systemctl restart nix-daemon
          fi
      - name: Package and harness checks
        run: |
          nix build -L --no-link --print-out-paths .#packages.x86_64-linux.cargoArtifacts | tee -a /tmp/attic-paths
          read -r -a pkg <<< "$PACKAGE_CHECKS"
          refs=()
          for c in "${pkg[@]}"; do
            refs+=("./ci#checks.x86_64-linux.$c")
          done
          nix build -L --keep-going --no-link --print-out-paths "${refs[@]}" | tee -a /tmp/attic-paths
      - name: Push to Attic cache
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          if [ -z "${ATTIC_TOKEN:-}" ]; then
            echo "ATTIC_TOKEN is not set; skipping Attic cache push"
            exit 0
          fi
          if [ ! -s /tmp/attic-paths ]; then
            echo "No paths to push; skipping Attic cache push"
            exit 0
          fi
          nix shell --inputs-from . nixpkgs#attic-client -c attic login ci https://attic.json64.dev "$ATTIC_TOKEN"
          for i in 1 2 3; do nix shell --inputs-from . nixpkgs#attic-client -c xargs -r -a /tmp/attic-paths attic push ci && exit 0; echo "attic push ci failed (attempt $i)" >&2; sleep $((i * 10)); done; exit 1

  fmt:
    if: ${{ !inputs.client_build_probe }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
      - run: nix fmt -- --ci
        working-directory: ci

  client-build-probe:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.client_build_probe }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE: release
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install toolchain
        run: rustup toolchain install 1.95.0 --profile minimal && rustup default 1.95.0
      - name: Prepare both dependency graphs in the normal Cargo target
        run: |
          cargo test --locked --release -j 4 --no-default-features --features client --lib --test shared_client --no-run
          cargo test --locked --release -j 4 --lib --no-run
      - name: Measure the client arm and daemon-enabling arm
        run: |
          python3 - <<'PY'
          import importlib.util
          from pathlib import Path
          import shutil
          import tempfile
          spec = importlib.util.spec_from_file_location("mutants", "scripts/client-mutants.py")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          for name, filename, old, new, test in module.CASES:
              if name not in {"bounded-read", "self-dev-default-leak"}:
                  continue
              with tempfile.TemporaryDirectory(prefix="client-build-probe-") as temp:
                  dest = Path(temp)
                  for file in ("Cargo.toml", "Cargo.lock"):
                      shutil.copyfile(module.ROOT / file, dest / file)
                  for folder in ("src", "tests", "scripts", "ci"):
                      shutil.copytree(module.ROOT / folder, dest / folder, copy_function=shutil.copyfile)
                  green = module.run(dest, test, changed_source=filename, label=f"{name}:baseline")
                  module.require(green.returncode == 0 and "1 passed; 0 failed; 0 ignored" in green.stdout, (name, "baseline", green.stdout, green.stderr))
                  source = dest / filename
                  text = source.read_text()
                  module.require(text.count(old) == 1, "mutant anchor mismatch")
                  source.write_text(text.replace(old, new, 1))
                  red = module.run(dest, test, changed_source=filename, label=f"{name}:mutant")
                  selected = "client::feature_tests::no_daemon" if test == "@feature" else test
                  module.require(red.returncode == 101 and f"test {selected} ... FAILED" in red.stdout, (name, "wrong red", red.stdout, red.stderr))
          print("client-build-probe:2/2 GREEN baseline / RED intended")
          PY
