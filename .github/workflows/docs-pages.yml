name: Docs

# The docs site is node, not nix — it is the one thing in this repository that
# does not go through the flake. Scoped to docs/** so a change to the daemon or
# client does not rebuild and redeploy the site.
on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs-pages.yml"]
  pull_request:
    branches: [main]
    paths: ["docs/**", ".github/workflows/docs-pages.yml"]
  workflow_dispatch:
    inputs:
      fleet_pin_rev:
        description: "Optional fleet pin commit SHA override"
        required: false
        type: string

permissions:
  contents: read

# Cancel superseded PR runs; non-PR runs use run_id so main pushes never cancel or queue.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Version comes from `packageManager` in docs/package.json, so CI runs the
      # same pnpm that produced the lockfile rather than a range that can drift.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: docs/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      # --frozen-lockfile so a lockfile that disagrees with package.json fails
      # here rather than silently resolving to something no one has built.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run status:test
      - run: pnpm run build
        env:
          DOCS_STATUS_STRICT: "${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}"
          FLEET_PIN_REV: "${{ inputs.fleet_pin_rev || '' }}"
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist
          include-hidden-files: true

  # Split from the build so pull requests get the build signal without a deploy.
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # Never cancel a Pages deploy in flight; serialize deploys on the github-pages environment.
    concurrency:
      group: docs-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
