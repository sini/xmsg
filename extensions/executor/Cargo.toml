[package]
name = "xmsg-executor"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "Internal contracts and deterministic ACP fixtures for an optional xmsg executor"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
thiserror = "2.0"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.11"
hex = "0.4"
libc = "0.2"
getrandom = "0.4"
xmsg = { path = "../..", default-features = false, features = ["client"] }

[dev-dependencies]
tempfile = "3.17"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
